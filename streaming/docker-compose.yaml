services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: ais-kafka
    hostname: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      # Temporary retention to limit disk usage
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    restart: unless-stopped

  ais-producer:
    build:
      context: .
      dockerfile: Dockerfile.producers
    container_name: ais-producer
    env_file: .env          # AISSTREAM_API_KEY, etc. — never baked into the image
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092 
      AIS_MAX_MESSAGES: "0"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  weather-producer:
    build:
      context: .
      dockerfile: Dockerfile.producers
    container_name: weather-producer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: python -u producers/weather_producer.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: ais-postgres
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: vessel_tracking
      POSTGRES_USER: ais_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ais_user -d vessel_tracking"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: ais-spark-master
    hostname: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    ports:
      - "18080:8080"
      - "7077:7077"

    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}  
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092 

    volumes:
     - ./spark:/opt/spark-apps    

    restart: unless-stopped

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: ais-spark-worker
    hostname: spark-worker

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    ports:
      - "8081:8081"

    depends_on:
      - spark-master
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}  
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
     - ./spark:/opt/spark-apps          

    restart: unless-stopped
  silver-stream:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: ais-silver-stream
    hostname: silver-stream

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --py-files
      - /opt/spark/jars/delta-spark_2.12-3.3.2.jar
      - /opt/spark-apps/silver_stream.py

    ports:
      - "4040:4040"          # SparkUI for the driver

    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092     # explicit, not just relying on common.py default
      S3_BUCKET: ${S3_BUCKET:-g9-ais-project}

    volumes:
      - ./spark:/opt/spark-apps

    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  kafka_data:
  postgres_data: