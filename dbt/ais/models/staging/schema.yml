version: 2

models:
  - name: stg_ais_positions
    description: "AIS position reports, deduplicated per vessel and time, with Open-Meteo weather and a sea-state bucket. Missing weather stays NULL (sea_state = 'Unknown')."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [vessel_mmsi, event_time]
            
    columns:
      - name: vessel_mmsi
        description: "Vessel MMSI"
        tests: [not_null]
      - name: event_time
        description: "UTC time of the position report"
        tests: [not_null]
      - name: speed_knots
        description: "Speed over ground in knots"
      - name: sea_state
        description: "Calm / Moderate (waves >= 1.5 m or wind >= 30 km/h) / Rough (waves >= 3 m or wind >= 50 km/h) / Unknown (no weather)"
        tests:
          - accepted_values:
              arguments:
                values: ['Calm', 'Moderate', 'Rough', 'Unknown']
      - name: latitude
        tests:
          - dbt_utils.accepted_range:
              arguments:
                {min_value: -90, max_value: 90}
      - name: longitude
        tests:
          - dbt_utils.accepted_range:
              arguments:
                {min_value: -180, max_value: 180}
      - name: speed_knots
        tests:
          - dbt_utils.accepted_range:
              arguments:
                {min_value: 0, max_value: 60}
      - name: wave_height_m
        tests:
          - dbt_utils.accepted_range:
              arguments:
                {min_value: 0, max_value: 25}

  - name: stg_ais_vessels
    description: "AIS static messages (one per message received) with ship category, a cleaned destination and a reconstructed ETA timestamp."
    columns:
      - name: vessel_mmsi
        tests: [not_null]
      - name: destination_text
        description: "Destination after cleaning; for routes like 'EGALY>NLRTM' the part after the last '>'"
      - name: destination_locode
        description: "Destination as a 5-letter UN/LOCODE when the crew typed one"
      - name: eta_ts
        description: "Declared ETA as a timestamp. AIS sends no year, so the year closest to the message time is used. NULL when the ETA was not available."

  - name: stg_ports_activity
    description: "PortWatch daily port activity, renamed, with date parts"
    columns:
      - name: port_id
        tests: [not_null]
      - name: activity_date
        tests: [not_null]

  - name: stg_ports_ref
    description: "PortWatch port reference, renamed and trimmed"
    columns:
      - name: port_id
        tests: [unique, not_null]
