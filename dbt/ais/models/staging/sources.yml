version: 2

sources:
  - name: raw
    database: AIS
    schema: RAW
    description: "Raw silver-tier data loaded from S3 into Snowflake"
    tables:
      - name: ports_activity
        description: "Daily port traffic metrics, vessel calls, import/export cargo volumes"
        columns:
          - name: portid
            tests:
              - not_null
          - name: date
            tests:
              - not_null

      - name: ports_ref
        description: "Port master reference, geographic coordinates, country, and UN/LOCODE"
        columns:
          - name: portid
            tests:
              - unique
              - not_null
              
      - name: live_telemetry
        description: "Enriched AIS vessel tracking pings joined with weather"
        columns:
          - name: user_id
            description: "Vessel MMSI identifier"
            tests:
              - not_null
          - name: event_time
            description: "UTC timestamp of position report"
            tests:
              - not_null

