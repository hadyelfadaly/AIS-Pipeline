name: Streaming CI Pipeline

on:
  push:
    branches: [main, development]
    paths:
      - "streaming/**"
      - ".github/workflows/streaming-ci.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "streaming/**"
      - ".github/workflows/streaming-ci.yml"

jobs:
  test-streaming:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./streaming

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: streaming/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v
